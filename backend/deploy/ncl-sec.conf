# The three headers that must survive on every response. Included inside each location
# that sets its own `add_header` -- nginx drops inherited headers as soon as a location
# adds one, which is why these used to disappear on the HTML pages.
#
# `$hsts_header` is a map (defined in ncl.conf): one year on https, empty on http, and an
# empty value makes nginx skip the header entirely.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security $hsts_header always;
