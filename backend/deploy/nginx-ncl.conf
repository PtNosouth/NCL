# nclzs.com — plain HTTP redirects the domain to HTTPS, TLS serves the site.
# Shared locations live in /etc/nginx/snippets/ncl-static.conf (deploy/ncl-static.conf).

# cache zone for the content API's micro-cache
proxy_cache_path /var/cache/nginx/ncl_api levels=1:2 keys_zone=ncl_api:10m
                 inactive=10m max_size=64m use_temp_path=off;

# HSTS only on https; an empty value makes nginx skip the header on http
map $scheme $hsts_header {
    https   "max-age=31536000";
    default "";
}

# ── HTTP ─────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name nclzs.com www.nclzs.com _;

    # certificate renewals must keep working over plain HTTP
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ncl/current;
        default_type "text/plain";
    }

    # the real domain goes to https; a bare-IP request keeps working over http
    if ($host = nclzs.com)     { return 301 https://$host$request_uri; }
    if ($host = www.nclzs.com) { return 301 https://$host$request_uri; }

    include /etc/nginx/snippets/ncl-static.conf;
}

# ── HTTPS ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name nclzs.com www.nclzs.com;

    ssl_certificate     /etc/letsencrypt/live/nclzs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nclzs.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nclzs.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/ncl-static.conf;
}
