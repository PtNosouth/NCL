# Everything shared by the plain-HTTP and the TLS server block: the document root, the
# cache policy and the hardening headers. Included by both.
#
# Every location that sets `add_header` re-includes ncl-sec.conf: nginx replaces the
# inherited set instead of merging it, so without this the security headers vanish on the
# pages that matter (the HTML).

root /var/www/ncl/current;
index index.html;

charset utf-8;
server_tokens off;

# text compresses well; the images and the film are already compressed
gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_vary on;
# `text/javascript` matters: that is the Content-Type this site sends for .js, and
# gzip_types matches it exactly (it was listed as application/javascript, so no script
# was ever compressed).
gzip_types text/plain text/css text/javascript application/javascript application/json
           image/svg+xml font/ttf font/woff2;

# HTML always revalidates, so a deploy shows up immediately
location ~* \.html$ {
    include snippets/ncl-sec.conf;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
}

# the media and fonts never change under the same name
location ^~ /media/ {
    include snippets/ncl-sec.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Accept-Ranges bytes;
    try_files $uri =404;
}
location ^~ /fonts/ {
    include snippets/ncl-sec.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
}
location ^~ /vendor/ {
    include snippets/ncl-sec.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# every script and stylesheet is referenced with ?v=<deploy stamp>, so it can be cached
# for good: a deploy changes the URL. (HTML stays no-cache, and the admin keeps its own
# no-cache location.)
location ~* \.(css|js)$ {
    include snippets/ncl-sec.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location / {
    include snippets/ncl-sec.conf;
    try_files $uri $uri/ $uri.html =404;
}

error_page 404 /index.html;

# ── content API ──────────────────────────────────────────────────────────
# Same origin on purpose: the admin session cookie is SameSite=Strict and HttpOnly, so
# no CORS, no token in localStorage, nothing for a browser to leak.
# the public bundle gets a five second micro-cache: a burst of visitors (or one visitor
# reloading) hits this instead of the app, and an edit is live within a few seconds.
# The app answers with Cache-Control: no-store, which nginx would honour, so the header is
# ignored *here only* -- browsers still revalidate, the cache is server side.
location = /api/site.js {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache ncl_api;
    proxy_cache_valid 200 5s;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control;
    add_header X-Cache $upstream_cache_status;
    add_header Cache-Control "no-cache" always;
}

location = /api/site {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache ncl_api;
    proxy_cache_valid 200 5s;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control;
    add_header X-Cache $upstream_cache_status;
    add_header Cache-Control "no-cache" always;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 400m;      # the cover film
    proxy_request_buffering off;    # uploads stream straight to the app
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# uploaded images and films, straight off disk (nginx does Range for the video)
location ^~ /uploads/ {
    alias /var/www/ncl-data/uploads/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# the admin UI is static; only its data goes through the API
location ^~ /admin/ {
    alias /opt/ncl-api/admin/;
    index index.html;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
}
location = /admin { return 301 /admin/; }
